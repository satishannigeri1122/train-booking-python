services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: trainbooking
      POSTGRES_USER: trainuser
      POSTGRES_PASSWORD: trainpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainuser -d trainbooking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.1-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: postgres:16.4-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: trainpass
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for file in /migrations/*.sql; do
          echo "Applying $$file"
          psql -v ON_ERROR_STOP=1 -h postgres -U trainuser -d trainbooking -f "$$file"
        done

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://trainuser:trainpass@postgres:5432/trainbooking
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
